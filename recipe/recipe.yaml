schema_version: 1

context:
  version: "3.37.0"

package:
  name: sardana-nxsrecorder
  version: ${{ version }}

source:
  url: https://github.com/nexdatas/sardana-nxs-recorder/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 7e717e7c402e224393f0dbc10d8724e79a82dcad18fdeca3c8cb6ffe8d65fb68

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61
    - pip
    - wheel
  run:
    - python >=${{ python_min }}
    - pytango
    - nxstools >=4.29.0
    - numpy
    - lxml
    - pytz
    - sardana
    - nxsrecselector
    - nxswriter

tests:
  - python:
      imports:
        - sardananxsrecorder
        - sardananxsrecorder.nxsrecorder
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/nexdatas/sardana-nxs-filerecorder
  repository: https://github.com/nexdatas/sardana-nxs-filerecorder
  license: GPL-3.0-or-later
  license_file: COPYRIGHT
  summary: Sardana NeXus File Recorder
  description: |
    NeXus scan recorder for Sardana which stores experimenal data
    in NeXus/HDF5 file with use of NeXDatas Tango Server or packages,
    i.e. NXSDataWriter, NXSConfigServer, NXSRecSelector.

extra:
  recipe-maintainers:
    - jkotan
